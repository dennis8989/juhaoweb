version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 20 || nvm install 20
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - echo "AWS_BRANCH=$AWS_BRANCH"
        - |
          case "${AWS_BRANCH}" in
            amplify)
              echo "Production branch: deploying backend..."
              npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
              ;;
            *)
              echo "Sharing existing amplify backend..."
              npx ampx generate outputs --branch amplify --app-id "$AWS_APP_ID"
              ;;
          esac
frontend:
  phases:
    build:
      commands:
        - nvm use 20 || nvm install 20
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
