<!DOCTYPE html>
<html lang="zh-TW" class="fonts-loading">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      網頁字型分兩層：
      1. 核心字型檔：建置時依網站內容切好（public/fonts/，scripts/build-fonts.mjs 產生），由 vite.config.js
         的 coreFontsPlugin 加在 head 最後面（preload 與 @font-face），第一次造訪約 1.4 MB，之後換頁不必再下載。
         （這段註解裡不能出現 head 的結尾標籤，Vite 會把東西插進去。）
      2. 備援：font.emtech.cc 依字切片的字型 CSS。部署之後新文章才出現的字由它補上，
         由 src/lib/fontGate.js 在第一次遇到這種字時才掛上，所以不會擋住畫面與程式啟動。
         沒有 JavaScript 時整套改用它。
    -->
    <link rel="preconnect" href="https://font.emtech.cc" crossorigin />
    <noscript>
      <link href="https://font.emtech.cc/css/GenSenRoundedTW/400" rel="stylesheet" />
      <link href="https://font.emtech.cc/css/GenSenRoundedTW/700" rel="stylesheet" />
      <link href="https://font.emtech.cc/css/GenRyuMinTW/400" rel="stylesheet" />
      <link href="https://font.emtech.cc/css/GenRyuMinTW/600" rel="stylesheet" />
      <link href="https://font.emtech.cc/css/Iansui/400" rel="stylesheet" />
    </noscript>
    <!-- 等網頁字型（關於我頁另加醫師照片）載好再顯示畫面，最多 4.5 秒（src/lib/fontGate.js）；萬一程式沒跑，5 秒後也會自動顯示 -->
    <style>
      #root { transition: opacity 0.25s ease; }
      html.fonts-loading #root { opacity: 0; animation: fonts-failsafe 0s linear 5s forwards; }
      @keyframes fonts-failsafe { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #root { transition: none; } }
    </style>
    <title>李如浩醫師 | 兒童成長發育專科 | 小兒內分泌</title>
    <meta name="description" content="李如浩醫師，兒童成長發育專科。以醫學實證與臨床經驗，陪伴孩子的身高、骨齡、性早熟、青春期與生長激素治療。" />
    <meta name="author" content="李如浩醫師" />
    <meta name="keywords" content="李如浩,兒童成長門診,小兒內分泌,兒童生長問題,性早熟,成長針,菡生婦幼診所,小兒科" />

    <!-- Open Graph / Facebook。每頁的標題、描述、網址由 src/lib/seo.js 依頁面更新 -->
    <meta property="og:site_name" content="李如浩醫師｜兒童成長發育專科" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="李如浩醫師 - 兒童成長門診 | 小兒內分泌專科" />
    <meta property="og:description" content="專精於兒童生長問題、性早熟、小兒內分泌等領域。菡生婦幼診所小兒科專任醫師。" />
    <meta property="og:image" content="https://ruhowgrow.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="李如浩醫師 - 兒童成長門診 | 小兒內分泌專科" />
    <meta name="twitter:description" content="專精於兒童生長問題、性早熟、小兒內分泌等領域。菡生婦幼診所小兒科專任醫師。" />
    <meta name="twitter:image" content="https://ruhowgrow.com/og-image.png" />
  </head>
